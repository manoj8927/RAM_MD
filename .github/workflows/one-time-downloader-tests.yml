name: One-time downloader key-mode regression tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-downloader-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'manoj8927/RAM_MD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public, private, and missing-key downloader tests
        run: node --test tests/ram-downloader-api.test.js
