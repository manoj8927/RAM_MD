name: One-time cleanup of merged RAM_MD branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'manoj8927/RAM_MD'
    runs-on: ubuntu-latest
    steps:
      - name: Verify every extra branch was merged and has not moved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          specs=(
            'feature/extra-commands-custom-settings 7d31e44f62d169fe554c142d3adbafd5cca2277d 4'
            'feature/more-tools-and-theme-controls 27a8093a5ba3d37828f6d22ab0804a1dcdc97e78 5'
            'feature/ram-downloader-api-integration d436620260cad75b92e5dd6601fc3f48d66f2aed 1'
            'fix/core-reliability-and-plugin-safety 11d1b14113234103bc5b03fef9fa2c72cf5761a6 3'
            'fix/menu-navigation-overview c33ea5c9ce2ca54de1ebdf2a7eaff8c50f3b6ee1 2'
          )
          for item in "${specs[@]}"; do
            read -r branch expected pr <<< "$item"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged')"
            if [[ "$actual" != "$expected" || "$merged" != 'true' ]]; then
              echo "::error::Ref ${branch} has changed or PR #${pr} is not merged; aborting without deletion."
              exit 1
            fi
          done
          for item in "${specs[@]}"; do
            read -r branch expected pr <<< "$item"
            echo "Removing merged branch: $branch (PR #$pr)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          done
          echo 'Cleanup complete. Only main should remain.'
