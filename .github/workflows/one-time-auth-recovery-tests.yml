name: One-time WhatsApp auth recovery regression tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-auth-recovery-tests.yml'
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'manoj8927/RAM_MD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test logout backup, persistent symlink and crash-recovery guards
        run: node --test tests/session-recovery.test.js
