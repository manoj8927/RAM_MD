name: One-time Royal menu regression check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-royal-menu-tests.yml'
permissions:
  contents: read
jobs:
  royal-menu-tests:
    if: github.repository == 'manoj8927/RAM_MD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install required dependencies
        run: npm ci --omit=optional
      - name: Validate Royal menu, customization and legacy navigation
        run: node --test tests/menu.test.js tests/royal-menu.test.js tests/customization.test.js
