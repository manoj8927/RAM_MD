<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }
  html, body { margin:0; background:#07110c; color:#fff; font-family:system-ui,sans-serif; }
  .app { max-width:420px; margin:0 auto; padding:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin:2px 2px 8px; font-size:12px; font-weight:700; letter-spacing:1px; color:#4ade80; }
  .stage { position:relative; border:2px solid #166534; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 0 18px #22c55e44; }
  canvas { display:block; width:100%; height:auto; }
  #pause { position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:10px; border:1px solid #22c55e; background:#0b2a17; color:#4ade80; font-size:14px; }
  #ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000c; text-align:center; padding:20px; }
  #ov h1 { margin:0 0 8px; font-size:36px; color:#4ade80; letter-spacing:3px; text-shadow:0 0 14px #4ade8088; }
  #ov p { margin:4px 0 14px; color:#cfd6d2; font-size:14px; }
  .go { padding:14px 28px; border:0; border-radius:12px; font-weight:800; font-size:16px; color:#04130a; background:linear-gradient(180deg,#4ade80,#16a34a); box-shadow:0 0 16px #22c55e99; }
  .pad { display:grid; grid-template-columns:repeat(3,76px); grid-template-rows:repeat(2,58px); gap:8px; justify-content:center; margin:14px 0; }
  .pad button { border-radius:14px; font-size:22px; font-weight:800; color:#4ade80; background:#0b2a17; border:1px solid #22c55e; }
  .pad button:active { filter:brightness(1.7); }
  .pad .u { grid-column:2; grid-row:1; } .pad .l { grid-column:1; grid-row:2; } .pad .d { grid-column:2; grid-row:2; } .pad .r { grid-column:3; grid-row:2; }
  .stats { display:flex; border:1px solid #1f3a2b; border-radius:12px; overflow:hidden; background:#0b1a12; }
  .stats div { flex:1; padding:8px 4px; text-align:center; border-right:1px solid #1f3a2b; }
  .stats div:last-child { border:0; }
  .stats small { display:block; font-size:10px; color:#86a899; letter-spacing:1px; }
  .stats b { font-size:16px; }
  .foot { text-align:center; font-size:10px; letter-spacing:2px; color:#22c55e; margin:12px 0 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span>🐍 SNAKE</span><span id="lv">LEVEL 1</span></div>

  <div class="stage">
    <canvas id="c" width="360" height="360"></canvas>
    <button id="pause">❚❚</button>
    <div id="ov">
      <h1 id="ot">SNAKE</h1>
      <p id="om">Eat the apples, avoid the walls and yourself</p>
      <button class="go" id="go">START GAME</button>
    </div>
  </div>

  <div class="pad">
    <button class="u" id="U">▲</button>
    <button class="l" id="L">◀</button>
    <button class="d" id="D">▼</button>
    <button class="r" id="R">▶</button>
  </div>

  <div class="stats">
    <div><small>SCORE</small><b id="ss">0</b></div>
    <div><small>BEST</small><b id="sb">0</b></div>
    <div><small>LENGTH</small><b id="sl">3</b></div>
  </div>
  <div class="foot">POWERED BY 𝐒α͜͡𝐧𝐣σყメ𝐗𝐓ε𝐜𝐡 🔥</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('c'), ctx = cv.getContext('2d');
  var N = 18, S = cv.width / N;

  var state = 'ready', best = 0;
  try { best = +localStorage.getItem('snake_best') || 0; } catch (e) {}
  var snake, dir, queue, food, score, level, acc, last = 0;

  function reset() {
    snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
    dir = { x: 1, y: 0 }; queue = []; score = 0; level = 1; acc = 0;
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (!snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function turn(dx, dy) {
    if (state !== 'play') return;
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (ref.x === -dx && ref.y === -dy) return;   // no reversing
    if (ref.x === dx && ref.y === dy) return;
    if (queue.length < 2) queue.push({ x: dx, y: dy });
  }

  function over(win) {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('snake_best', String(best)); } catch (e) {} }
    $('ot').textContent = win ? 'YOU WIN!' : 'GAME OVER';
    $('om').textContent = 'Score ' + score + '   Best ' + best;
    $('go').textContent = 'PLAY AGAIN';
    $('ov').style.display = 'flex';
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return over(false);
    var ate = food && head.x === food.x && head.y === food.y;
    var body = ate ? snake : snake.slice(0, -1);        // the tail moves away unless we grow
    if (body.some(function (s) { return s.x === head.x && s.y === head.y; })) return over(false);
    snake.unshift(head);
    if (ate) {
      score += 10;
      level = 1 + Math.floor(score / 50);
      placeFood();
      if (!food) return over(true);
    } else {
      snake.pop();
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#04100a'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#0a1f14';
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) if ((x + y) % 2 === 0) ctx.fillRect(x * S, y * S, S, S);

    if (food) {
      ctx.save(); ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff4d4d'; ctx.beginPath();
      ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S * 0.36, 0, 6.283); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#86efac'; ctx.fillRect(food.x * S + S / 2 - 1, food.y * S + 2, 3, 5);
    }

    snake.forEach(function (s, i) {
      var t = 1 - i / Math.max(snake.length, 6) * 0.55;
      ctx.save();
      if (i === 0) { ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 12; }
      ctx.fillStyle = i === 0 ? '#86efac' : 'rgba(34,197,94,' + t.toFixed(2) + ')';
      rr(s.x * S + 1.5, s.y * S + 1.5, S - 3, S - 3, 6); ctx.fill(); ctx.restore();
    });

    var h = snake[0];                      // eyes
    ctx.fillStyle = '#04130a';
    var ex = dir.x === 0 ? [-4, 4] : [dir.x * 4, dir.x * 4], ey = dir.y === 0 ? [-4, 4] : [dir.y * 4, dir.y * 4];
    for (var k = 0; k < 2; k++) { ctx.beginPath(); ctx.arc(h.x * S + S / 2 + ex[k], h.y * S + S / 2 + ey[k], 2.2, 0, 6.283); ctx.fill(); }
  }

  function hud() {
    $('ss').textContent = score;
    $('sb').textContent = Math.max(best, score);
    $('sl').textContent = snake.length;
    $('lv').textContent = 'LEVEL ' + level;
  }

  function loop(t) {
    var dt = last ? Math.min(100, t - last) : 16;
    last = t;
    if (state === 'play') {
      acc += dt;
      var every = Math.max(190, 320 - (level - 1) * 6);
      while (acc >= every && state === 'play') { acc -= every; step(); }
    }
    draw(); hud();
    requestAnimationFrame(loop);
  }

  function press(el, fn) { el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); }); }
  press($('U'), function () { turn(0, -1); });
  press($('D'), function () { turn(0, 1); });
  press($('L'), function () { turn(-1, 0); });
  press($('R'), function () { turn(1, 0); });

  $('go').addEventListener('click', function () {
    if (state === 'pause') { state = 'play'; $('ov').style.display = 'none'; last = 0; }
    else { reset(); state = 'play'; $('ov').style.display = 'none'; last = 0; }
  });
  $('pause').addEventListener('click', function () {
    if (state === 'play') {
      state = 'pause';
      $('ot').textContent = 'PAUSED'; $('om').textContent = 'Take a breath'; $('go').textContent = 'RESUME';
      $('ov').style.display = 'flex';
    }
  });

  var sx = null, sy = null;
  cv.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w') turn(0, -1);
    else if (k === 'ArrowDown' || k === 's') turn(0, 1);
    else if (k === 'ArrowLeft' || k === 'a') turn(-1, 0);
    else if (k === 'ArrowRight' || k === 'd') turn(1, 0);
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
