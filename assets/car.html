<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Car Race</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }
  html, body { margin:0; background:#0a0f0d; color:#fff; font-family:system-ui,sans-serif; }
  .app { max-width:420px; margin:0 auto; padding:10px; }
  .nitro { display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:1px; color:#ffb347; margin:4px 2px; }
  .bar { height:6px; background:#222; border-radius:4px; overflow:hidden; margin-bottom:8px; }
  .bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#22c55e,#facc15,#f97316); }
  .stage { position:relative; border:2px solid #7a3b12; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 0 18px #f9731655; }
  canvas { display:block; width:100%; height:auto; }
  #pause { position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:10px; border:1px solid #f97316; background:#3a1d0a; color:#ffb347; font-size:16px; }
  #ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000c; text-align:center; padding:20px; }
  #ov h1 { margin:0 0 8px; font-size:34px; color:#ff6b6b; letter-spacing:2px; text-shadow:0 0 14px #ff6b6b88; }
  #ov p { margin:4px 0 14px; color:#cfd6d2; font-size:14px; }
  .go { padding:14px 26px; border:0; border-radius:12px; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(180deg,#ff9a3c,#f2541b); box-shadow:0 0 16px #f9731699; }
  .ctrl { display:flex; gap:10px; margin:12px 0; }
  .ctrl button { flex:1; height:58px; border-radius:14px; font-size:20px; font-weight:800; color:#ffb347; background:#2b1608; border:1px solid #f97316; }
  .ctrl button.boost { flex:1.6; color:#7dd3fc; background:#0b2230; border-color:#38bdf8; font-size:16px; }
  .ctrl button:active { filter:brightness(1.6); }
  .stats { display:flex; border:1px solid #2a3a33; border-radius:12px; overflow:hidden; background:#0e1713; }
  .stats div { flex:1; padding:8px 4px; text-align:center; border-right:1px solid #2a3a33; }
  .stats div:last-child { border:0; }
  .stats small { display:block; font-size:10px; color:#8fa39a; letter-spacing:1px; }
  .stats b { font-size:15px; }
  .foot { text-align:center; font-size:10px; letter-spacing:2px; color:#f97316; margin:12px 0 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="nitro"><span>⚡ NITRO</span><span id="nl">READY</span></div>
  <div class="bar"><i id="nb"></i></div>

  <div class="stage">
    <canvas id="c" width="360" height="600"></canvas>
    <button id="pause">❚❚</button>
    <div id="ov">
      <h1 id="ot">CAR RACE</h1>
      <p id="om">Dodge traffic, hit BOOST for speed</p>
      <button class="go" id="go">START ENGINE</button>
    </div>
  </div>

  <div class="ctrl">
    <button id="L">◀</button>
    <button id="B" class="boost">⚡ BOOST</button>
    <button id="R">▶</button>
  </div>

  <div class="stats">
    <div><small>BEST</small><b id="sb">0</b></div>
    <div><small>SPEED</small><b id="ss">0 km/h</b></div>
    <div><small>DIST</small><b id="sd">0m</b></div>
  </div>
  <div class="foot">POWERED BY 𝐒α͜͡𝐧𝐣σყメ𝐗𝐓ε𝐜𝐡 🔥</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('c'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, RX = 40, RW = 280, LANES = 4, LW = RW / LANES;
  var laneX = function (i) { return RX + LW * i + LW / 2; };
  var COLORS = ['#ff3b5c', '#ff5fa2', '#3ba9ff', '#a96bff', '#37d6a1'];

  var state = 'ready', best = 0, boostHeld = false, last = 0;
  try { best = +localStorage.getItem('car_best') || 0; } catch (e) {}
  var p, obs, coins, speed, nitro, dist, off, spawnT, coinT, boosting = false;

  function reset() {
    p = { lane: 1, x: laneX(1), y: H - 130, w: 34, h: 60 };
    obs = []; coins = []; speed = 80; nitro = 100; dist = 0; off = 0; spawnT = 0.8; coinT = 2; boosting = false;
  }
  reset();

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function car(c, color, glow) {
    var x = c.x - c.w / 2, y = c.y - c.h / 2;
    ctx.save();
    if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
    ctx.fillStyle = color; rr(x, y, c.w, c.h, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(x + 5, y + 14, c.w - 10, 14, 4); ctx.fill();   // windshield
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(x + 6, y + 36, c.w - 12, 10, 3); ctx.fill();    // rear window
    ctx.fillStyle = '#fff8'; ctx.fillRect(x + 4, y + 2, 6, 3); ctx.fillRect(x + c.w - 10, y + 2, 6, 3);
    ctx.fillStyle = '#ff2d2d'; ctx.fillRect(x + 4, y + c.h - 5, 6, 3); ctx.fillRect(x + c.w - 10, y + c.h - 5, 6, 3);
    ctx.restore();
  }

  function spawn() {
    var n = Math.random() < 0.25 ? 2 : 1;
    var lanes = [0, 1, 2, 3].sort(function () { return Math.random() - 0.5; }).slice(0, n);
    lanes.forEach(function (l) {
      obs.push({ x: laneX(l), y: -80, w: 34, h: 60, c: COLORS[(Math.random() * COLORS.length) | 0] });
    });
  }

  function crash() {
    state = 'over';
    var d = Math.floor(dist);
    if (d > best) { best = d; try { localStorage.setItem('car_best', String(best)); } catch (e) {} }
    $('ot').textContent = 'CRASH!';
    $('om').textContent = 'You drove ' + d + ' m. Best: ' + best + ' m';
    $('go').textContent = 'RACE AGAIN';
    $('ov').style.display = 'flex';
  }

  function start() {
    reset(); state = 'play'; $('ov').style.display = 'none'; last = 0;
  }

  function update(dt) {
    boosting = boostHeld && nitro > 0;
    var base = 80 + Math.min(80, dist / 40);
    speed += ((boosting ? base + 80 : base) - speed) * Math.min(1, dt * 3);
    nitro = boosting ? Math.max(0, nitro - 35 * dt) : Math.min(100, nitro + 8 * dt);
    var pps = speed * 3.4;
    off = (off + pps * dt) % 50;
    dist += speed / 3.6 * dt;
    p.x += (laneX(p.lane) - p.x) * Math.min(1, dt * 14);

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.45, 1.2 - speed / 260) + Math.random() * 0.4; }
    coinT -= dt;
    if (coinT <= 0) { coins.push({ x: laneX((Math.random() * 4) | 0), y: -20 }); coinT = 2 + Math.random() * 2; }

    obs.forEach(function (o) { o.y += pps * 0.55 * dt; });
    coins.forEach(function (c) { c.y += pps * dt; });
    obs = obs.filter(function (o) { return o.y < H + 90; });
    coins = coins.filter(function (c) { return c.y < H + 20; });

    for (var i = 0; i < obs.length; i++) {
      var o = obs[i];
      if (Math.abs(o.x - p.x) < (o.w + p.w) / 2 - 4 && Math.abs(o.y - p.y) < (o.h + p.h) / 2 - 6) { crash(); return; }
    }
    coins = coins.filter(function (c) {
      if (Math.abs(c.x - p.x) < 22 && Math.abs(c.y - p.y) < 34) { nitro = Math.min(100, nitro + 18); return false; }
      return true;
    });
  }

  function draw() {
    ctx.fillStyle = '#05080a'; ctx.fillRect(0, 0, W, H);
    // orange side glow
    var g = ctx.createLinearGradient(0, 0, RX, 0);
    g.addColorStop(0, '#f9731633'); g.addColorStop(1, '#f97316');
    ctx.fillStyle = g; ctx.fillRect(0, 0, RX, H);
    g = ctx.createLinearGradient(RX + RW, 0, W, 0);
    g.addColorStop(0, '#f97316'); g.addColorStop(1, '#f9731633');
    ctx.fillStyle = g; ctx.fillRect(RX + RW, 0, RX, H);
    // road
    ctx.fillStyle = '#15191c'; ctx.fillRect(RX, 0, RW, H);
    ctx.fillStyle = '#ffffffcc';
    for (var l = 1; l < LANES; l++) {
      for (var y = -50 + off; y < H; y += 50) ctx.fillRect(RX + LW * l - 1.5, y, 3, 28);
    }
    // coins
    coins.forEach(function (c) {
      ctx.save(); ctx.shadowColor = '#facc15'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(c.x, c.y, 7, 0, 6.283); ctx.fill(); ctx.restore();
    });
    // traffic and player
    obs.forEach(function (o) { car(o, o.c, false); });
    if (boosting) {
      ctx.fillStyle = '#38bdf8aa';
      for (var k = 0; k < 8; k++) ctx.fillRect(RX + 8 + Math.random() * (RW - 16), Math.random() * H, 2, 30 + Math.random() * 30);
      ctx.fillStyle = '#fb923c'; ctx.beginPath();
      ctx.moveTo(p.x - 8, p.y + p.h / 2); ctx.lineTo(p.x, p.y + p.h / 2 + 22 + Math.random() * 10); ctx.lineTo(p.x + 8, p.y + p.h / 2); ctx.fill();
    }
    car(p, '#ffc400', true);
  }

  function hud() {
    $('ss').textContent = Math.round(state === 'ready' ? 0 : speed) + ' km/h';
    $('sd').textContent = Math.floor(dist) + 'm';
    $('sb').textContent = Math.max(best, Math.floor(dist));
    $('nb').style.width = nitro + '%';
    $('nl').textContent = boosting ? 'BOOSTING!' : nitro < 5 ? 'EMPTY' : nitro >= 99 ? 'READY' : 'CHARGING';
  }

  function loop(t) {
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
    last = t;
    if (state === 'play') update(dt);
    draw(); hud();
    requestAnimationFrame(loop);
  }

  function move(d) { if (state === 'play') p.lane = Math.max(0, Math.min(LANES - 1, p.lane + d)); }
  function press(el, fn) { el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); }); }

  press($('L'), function () { move(-1); });
  press($('R'), function () { move(1); });
  var B = $('B');
  B.addEventListener('pointerdown', function (e) { e.preventDefault(); boostHeld = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { B.addEventListener(ev, function () { boostHeld = false; }); });

  $('go').addEventListener('click', function () {
    if (state === 'pause') { state = 'play'; $('ov').style.display = 'none'; last = 0; } else start();
  });
  $('pause').addEventListener('click', function () {
    if (state === 'play') {
      state = 'pause'; boostHeld = false;
      $('ot').textContent = 'PAUSED'; $('om').textContent = 'Take a breath'; $('go').textContent = 'RESUME';
      $('ov').style.display = 'flex';
    }
  });

  var sx = null;
  cv.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 30) move(dx > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key === ' ' || e.key === 'ArrowUp') boostHeld = true;
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'ArrowUp') boostHeld = false;
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
